name: Auto Update Site

on:
  push:
    branches:
      - main
    paths:
      - "1.Projects/Azure-VMSS-Web-Multi-Region-MultiAZ/Static Site/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Login To Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Discover VMSS And Update
        run: |
          set -e

          LOG_FILE="/tmp/vmss_update.log"
          echo "=== Deployment started: $(date) ===" > "$LOG_FILE"

          VMSS_LIST=$(az vmss list \
            --query "[?tags.App=='vmss-static-site'].[name,resourceGroup]" \
            -o tsv)

          if [ -z "$VMSS_LIST" ]; then
            echo "No VMSS Found" | tee -a "$LOG_FILE"
            exit 1
          fi

          echo "$VMSS_LIST" | while read VMSS RG; do
            echo "Deploying to VMSS: $VMSS (RG: $RG)" | tee -a "$LOG_FILE"

            az vmss run-command invoke \
              --resource-group "$RG" \
              --name "$VMSS" \
              --command-id RunShellScript \
              --scripts "curl -sSL https://raw.githubusercontent.com/Jammy-1/Mastering-Cloud/main/1.Projects/Azure-VMSS-Web-Multi-Region-MultiAZ/Modules/Scripts/update_site.sh | bash" \
              >> "$LOG_FILE" 2>&1 &
          done

          wait
          echo "=== Deployment finished: $(date) ===" | tee -a "$LOG_FILE"
